spring:
  application:
    name: email-excel-sender
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}
  error:
    include-message: never

google:
  sheet:
    url: ${GOOGLE_SHEET_URL:}
    tracking-url: ${GOOGLE_TRACKING_SHEET_URL:}

email:
  id-1: ${EMAIL_ID_1:}
  id-2: ${EMAIL_ID_2:}
  id-3: ${EMAIL_ID_3:}
  id-4: ${EMAIL_ID_4:}

app:
  gmail:
    credentials-file: ${GOOGLE_OAUTH_CREDENTIALS:./credentials.json}
    token-dir: ${GMAIL_TOKEN_DIR:${user.home}/.email-excel-sender/tokens}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/oauth2/callback}
    from-address: ${GMAIL_FROM_ADDRESS:}
  email:
    batch-limit: ${EMAIL_BATCH_LIMIT:250}
    delay-ms: ${EMAIL_DELAY_MS:300}
